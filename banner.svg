<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <!-- Cyan neon glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <!-- Purple neon glow -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <!-- Node glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <!-- Terminal header gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Matrix rain gradient -->
    <linearGradient id="matrixGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#cyanGrad)" opacity="0.8"/>

  <!-- Matrix rain column effects -->
  <rect x="50" y="0" width="2" height="300" fill="url(#matrixGrad)">
    <animate attributeName="y" from="-300" to="0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="180" y="0" width="1.5" height="300" fill="url(#matrixGrad)">
    <animate attributeName="y" from="-300" to="0" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="350" y="0" width="2" height="300" fill="url(#matrixGrad)">
    <animate attributeName="y" from="-300" to="0" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="920" y="0" width="1.5" height="300" fill="url(#matrixGrad)">
    <animate attributeName="y" from="-300" to="0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== NEURAL NETWORK NODES & EDGES (left side) ===== -->
  <!-- Layer 1 (input) - 4 nodes -->
  <circle cx="80" cy="80" r="6" fill="#00FFFF" filter="url(#glow)" opacity="0.9">
    <animate attributeName="r" values="6;7;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="130" r="6" fill="#00FFFF" filter="url(#glow)" opacity="0.9">
    <animate attributeName="r" values="6;7;6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="180" r="6" fill="#00FFFF" filter="url(#glow)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="230" r="6" fill="#00FFFF" filter="url(#glow)" opacity="0.6"/>

  <!-- Layer 2 (hidden) - 5 nodes -->
  <circle cx="170" cy="60" r="5" fill="#8B5CF6" filter="url(#glow)" opacity="0.8">
    <animate attributeName="r" values="5;6;5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="110" r="5" fill="#A855F7" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="160" r="5" fill="#8B5CF6" filter="url(#glow)" opacity="0.9"/>
  <circle cx="170" cy="210" r="5" fill="#A855F7" filter="url(#glow)" opacity="0.7">
    <animate attributeName="r" values="5;6;5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="255" r="5" fill="#8B5CF6" filter="url(#glow)" opacity="0.6"/>

  <!-- Layer 3 (hidden) - 4 nodes -->
  <circle cx="260" cy="90" r="5" fill="#00FFFF" filter="url(#glow)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="145" r="6" fill="#8B5CF6" filter="url(#glow)" opacity="0.9">
    <animate attributeName="r" values="6;7;6" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="200" r="5" fill="#00FFFF" filter="url(#glow)" opacity="0.7"/>

  <!-- Layer 4 (output) - 2 nodes -->
  <circle cx="340" cy="110" r="6" fill="#00FFFF" filter="url(#glowStrong)" opacity="0.9">
    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="190" r="6" fill="#A855F7" filter="url(#glowStrong)" opacity="0.9">
    <animate attributeName="r" values="6;8;6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Data pulse particles traveling along edges -->
  <circle r="2.5" fill="#00FFFF" filter="url(#glowSoft)" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M86,130 L164,110"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#A855F7" filter="url(#glowSoft)" opacity="0.8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M86,180 L164,210"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#8B5CF6" filter="url(#glowSoft)" opacity="0.9">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M175,110 L254,145"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#00FFFF" filter="url(#glowSoft)" opacity="0.8">
    <animateMotion dur="6s" repeatCount="indefinite" path="M265,145 L334,110"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Edges between layers (only a subset for visual clarity) -->
  <!-- L1->L2 -->
  <line x1="86" y1="80" x2="164" y2="60" stroke="#00FFFF" stroke-width="0.4" opacity="0.25"/>
  <line x1="86" y1="80" x2="164" y2="110" stroke="#00FFFF" stroke-width="0.4" opacity="0.25"/>
  <line x1="86" y1="80" x2="164" y2="160" stroke="#00FFFF" stroke-width="0.4" opacity="0.2"/>
  <line x1="86" y1="130" x2="164" y2="110" stroke="#A855F7" stroke-width="0.4" opacity="0.25"/>
  <line x1="86" y1="130" x2="164" y2="160" stroke="#A855F7" stroke-width="0.4" opacity="0.25"/>
  <line x1="86" y1="130" x2="164" y2="210" stroke="#A855F7" stroke-width="0.4" opacity="0.2"/>
  <line x1="86" y1="180" x2="164" y2="160" stroke="#00FFFF" stroke-width="0.4" opacity="0.25"/>
  <line x1="86" y1="180" x2="164" y2="210" stroke="#00FFFF" stroke-width="0.4" opacity="0.2"/>
  <line x1="86" y1="180" x2="164" y2="255" stroke="#00FFFF" stroke-width="0.4" opacity="0.15"/>
  <line x1="86" y1="230" x2="164" y2="210" stroke="#A855F7" stroke-width="0.4" opacity="0.2"/>
  <line x1="86" y1="230" x2="164" y2="255" stroke="#A855F7" stroke-width="0.4" opacity="0.15"/>

  <!-- L2->L3 -->
  <line x1="175" y1="60" x2="254" y2="90" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <line x1="175" y1="60" x2="254" y2="145" stroke="#8B5CF6" stroke-width="0.4" opacity="0.2"/>
  <line x1="175" y1="110" x2="254" y2="90" stroke="#A855F7" stroke-width="0.4" opacity="0.25"/>
  <line x1="175" y1="110" x2="254" y2="145" stroke="#A855F7" stroke-width="0.4" opacity="0.25"/>
  <line x1="175" y1="110" x2="254" y2="200" stroke="#A855F7" stroke-width="0.4" opacity="0.2"/>
  <line x1="175" y1="160" x2="254" y2="145" stroke="#8B5CF6" stroke-width="0.4" opacity="0.25"/>
  <line x1="175" y1="160" x2="254" y2="200" stroke="#8B5CF6" stroke-width="0.4" opacity="0.25"/>
  <line x1="175" y1="210" x2="254" y2="145" stroke="#A855F7" stroke-width="0.4" opacity="0.2"/>
  <line x1="175" y1="210" x2="254" y2="200" stroke="#A855F7" stroke-width="0.4" opacity="0.2"/>
  <line x1="175" y1="255" x2="254" y2="145" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>

  <!-- L3->L4 -->
  <line x1="265" y1="90" x2="334" y2="110" stroke="#00FFFF" stroke-width="0.5" opacity="0.25"/>
  <line x1="265" y1="90" x2="334" y2="190" stroke="#00FFFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="265" y1="145" x2="334" y2="110" stroke="#8B5CF6" stroke-width="0.6" opacity="0.35"/>
  <line x1="265" y1="145" x2="334" y2="190" stroke="#8B5CF6" stroke-width="0.6" opacity="0.3"/>
  <line x1="265" y1="200" x2="334" y2="110" stroke="#00FFFF" stroke-width="0.5" opacity="0.2"/>
  <line x1="265" y1="200" x2="334" y2="190" stroke="#00FFFF" stroke-width="0.5" opacity="0.2"/>

  <!-- Floating data particles -->
  <circle cx="120" cy="40" r="2" fill="#00FFFF" opacity="0.4" filter="url(#glow)">
    <animate attributeName="cy" values="40;35;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="35" r="1.5" fill="#A855F7" opacity="0.3">
    <animate attributeName="cy" values="35;30;35" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="55" r="2" fill="#00FFFF" opacity="0.3">
    <animate attributeName="cy" values="55;50;55" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="270" r="1.5" fill="#A855F7" opacity="0.3"/>
  <circle cx="230" cy="280" r="1.5" fill="#00FFFF" opacity="0.2"/>
  <circle cx="55" cy="160" r="2" fill="#8B5CF6" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== NAME & TITLE (center-right) ===== -->
  <text x="420" y="75" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="32" font-weight="700" fill="#00FFFF" filter="url(#glowStrong)">
    ───  ADITYA BHURE  ───
    <animate attributeName="opacity" values="1;0.85;1" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="420" y="110" font-family="'Inter', 'Segoe UI', sans-serif" font-size="17" fill="#C7D2FE" letter-spacing="1">
    AI / ML Engineer ⚡ Backend Developer
  </text>

  <!-- Code snippet block -->
  <rect x="420" y="130" width="530" height="75" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <rect x="420" y="130" width="530" height="24" rx="6" fill="url(#termHeader)"/>
  <circle cx="436" cy="142" r="5" fill="#EF4444">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="452" cy="142" r="5" fill="#F59E0B">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="468" cy="142" r="5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <text x="485" y="147" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6B7280">profile.sh</text>

  <text x="434" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6B7280">$</text>
  <text x="446" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00FFFF">cat</text>
  <text x="466" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#C7D2FE"> /etc/aditya/system.json</text>

  <text x="434" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6B7280">{</text>
  <text x="448" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">"status"</text>
  <text x="510" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00FFFF">"⚡ Open for Internships 2026"</text>

  <!-- ===== SKILL TAGS (bottom right) ===== -->
  <g transform="translate(420, 220)">
    <rect x="0" y="0" width="110" height="24" rx="12" fill="#00FFFF15" stroke="#00FFFF" stroke-width="1">
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="15" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FFFF">ML/DL</text>

    <rect x="120" y="0" width="110" height="24" rx="12" fill="#A855F715" stroke="#A855F7" stroke-width="1">
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite" begin="1.25s"/>
    </rect>
    <text x="132" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A855F7">Computer Vision</text>

    <rect x="240" y="0" width="110" height="24" rx="12" fill="#00FFFF15" stroke="#00FFFF" stroke-width="1">
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite" begin="2.5s"/>
    </rect>
    <text x="255" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FFFF">Backend APIs</text>

    <rect x="360" y="0" width="130" height="24" rx="12" fill="#A855F715" stroke="#A855F7" stroke-width="1">
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite" begin="3.75s"/>
    </rect>
    <text x="375" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A855F7">LLMs + RAG</text>
  </g>

  <!-- Bottom terminal bar -->
  <rect x="0" y="270" width="1000" height="30" fill="#0F172A" opacity="0.9"/>
  <rect x="0" y="270" width="1000" height="1" fill="#1E293B"/>
  <text x="15" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">adityabhure@system:~$</text>
  <text x="195" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00FFFF">cat /etc/banner</text>
  <text x="410" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A855F7">✦</text>
  <text x="425" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">ML Engineer </text>
  <text x="520" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7D2FE">·</text>
  <text x="530" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">Python </text>
  <text x="590" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7D2FE">·</text>
  <text x="600" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">DL/RL </text>
  <text x="650" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7D2FE">·</text>
  <text x="660" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">FastAPI </text>
  <text x="725" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#C7D2FE">·</text>
  <text x="735" y="289" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280">LLMs + RAG</text>

  <!-- Blinking cursor -->
  <rect x="835" y="275" width="8" height="18" rx="1" fill="#00FFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>