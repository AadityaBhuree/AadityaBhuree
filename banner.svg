<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#0A0A1A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glowP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="url(#bg)" rx="12"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="800" height="3" fill="url(#accent)"/>

  <!-- Glow effects -->
  <rect x="0" y="0" width="300" height="250" fill="url(#glow)"/>
  <rect x="500" y="0" width="300" height="250" fill="url(#glowP)"/>

  <!-- Neural network nodes (left side) -->
  <circle cx="60" cy="60" r="3" fill="#00FFFF" opacity="0.4" filter="url(#neon)"/>
  <circle cx="120" cy="40" r="2" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="100" cy="100" r="2.5" fill="#00FFFF" opacity="0.35"/>
  <circle cx="50" cy="140" r="2" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="140" cy="160" r="3" fill="#00FFFF" opacity="0.25"/>
  <circle cx="80" cy="190" r="2" fill="#8B5CF6" opacity="0.2"/>

  <!-- Neural connections -->
  <line x1="60" y1="60" x2="120" y2="40" stroke="#00FFFF" stroke-width="0.4" opacity="0.15"/>
  <line x1="60" y1="60" x2="100" y2="100" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
  <line x1="120" y1="40" x2="100" y2="100" stroke="#00FFFF" stroke-width="0.4" opacity="0.12"/>
  <line x1="100" y1="100" x2="50" y2="140" stroke="#8B5CF6" stroke-width="0.4" opacity="0.12"/>
  <line x1="100" y1="100" x2="140" y2="160" stroke="#00FFFF" stroke-width="0.4" opacity="0.1"/>
  <line x1="50" y1="140" x2="80" y2="190" stroke="#8B5CF6" stroke-width="0.4" opacity="0.1"/>

  <!-- Name / Title -->
  <text x="400" y="75" font-family="'JetBrains Mono', monospace" font-size="32" font-weight="700" fill="#00FFFF" text-anchor="middle" filter="url(#glowFilter)">ADITYA BHURE</text>

  <text x="400" y="105" font-family="'Inter', sans-serif" font-size="16" fill="#8B5CF6" text-anchor="middle" letter-spacing="3">AI / ML ENGINEER &amp; BACKEND DEVELOPER</text>

  <!-- Status bar -->
  <rect x="200" y="125" width="400" height="28" rx="14" fill="#161B22" stroke="rgba(0,255,255,0.1)" stroke-width="1"/>
  <text x="400" y="143" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF" text-anchor="middle">
    <tspan fill="#00FFFF">$</tspan> <tspan fill="#E5E7EB">cat</tspan> /etc/status
    <tspan fill="#10B981" font-size="9"> ● </tspan>
    <tspan fill="#9CA3AF">Open for Internships 2026</tspan>
  </text>

  <!-- Tag badges -->
  <rect x="140" y="170" height="24" rx="4" fill="rgba(0,255,255,0.08)" stroke="rgba(0,255,255,0.2)" stroke-width="0.5"/>
  <text x="148" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00FFFF">Deep Learning</text>

  <rect x="280" y="170" height="24" rx="4" fill="rgba(139,92,246,0.08)" stroke="rgba(139,92,246,0.2)" stroke-width="0.5"/>
  <text x="288" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B5CF6">Computer Vision</text>

  <rect x="430" y="170" height="24" rx="4" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)" stroke-width="0.5"/>
  <text x="438" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">Backend APIs</text>

  <rect x="555" y="170" height="24" rx="4" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.2)" stroke-width="0.5"/>
  <text x="563" y="185" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B">LLMs + RAG</text>

  <!-- Terminal-style bottom bar -->
  <rect x="0" y="215" width="800" height="35" fill="#05050A" opacity="0.5" rx="0"/>
  <text x="20" y="237" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9CA3AF">
    <tspan fill="#00FFFF">adityabhure@system:~$</tspan> <tspan fill="#8B5CF6">--</tspan><tspan fill="#E5E7EB">skills</tspan><tspan fill="#8B5CF6">=</tspan><tspan fill="#F59E0B">"ml,dl,cv,rl,api"</tspan>
  </text>
</svg>