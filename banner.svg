<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <!-- Import Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .font-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
      }
      .font-sub {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 600;
      }
      .font-badge {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 700;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111126" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    
    <!-- Drop Shadow Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#1e1e38" stroke-width="2"/>
  
  <!-- Neural Network Background Pattern -->
  <g opacity="0.3">
    <!-- Synaptic Connections -->
    <path d="M 50,50 L 150,120 L 250,80 L 350,150 L 450,100 L 550,180 L 650,120 L 750,70" stroke="#00ffff" stroke-width="1.5" opacity="0.4" />
    <path d="M 80,180 L 180,90 L 280,140 L 380,60 L 480,160 L 580,70 L 680,160 L 780,100" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4" />
    <path d="M 150,120 L 180,90 M 250,80 L 280,140 M 350,150 L 380,60 M 450,100 L 480,160 M 550,180 L 580,70 M 650,120 L 680,160" stroke="#00ffff" stroke-width="1" opacity="0.2" />

    <!-- Neural Nodes -->
    <circle cx="50" cy="50" r="4" fill="#00ffff" filter="url(#glow)" />
    <circle cx="150" cy="120" r="5" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="250" cy="80" r="4" fill="#00ffff" filter="url(#glow)" />
    <circle cx="350" cy="150" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="450" cy="100" r="4" fill="#00ffff" filter="url(#glow)" />
    <circle cx="550" cy="180" r="5" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="650" cy="120" r="4" fill="#00ffff" filter="url(#glow)" />
    <circle cx="750" cy="70" r="5" fill="#8b5cf6" filter="url(#glow)" />

    <circle cx="80" cy="180" r="4" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="180" cy="90" r="5" fill="#00ffff" filter="url(#glow)" />
    <circle cx="280" cy="140" r="4" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="380" cy="60" r="5" fill="#00ffff" filter="url(#glow)" />
    <circle cx="480" cy="160" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="580" cy="70" r="4" fill="#00ffff" filter="url(#glow)" />
    <circle cx="680" cy="160" r="5" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="780" cy="100" r="4" fill="#00ffff" filter="url(#glow)" />
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="720" cy="60" r="90" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="80" cy="180" r="70" fill="#d946ef" opacity="0.08" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <path d="M 30,25 L 770,25" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Name -->
  <text x="50" y="90" class="font-title" font-size="44" fill="#ffffff" letter-spacing="0.5">
    Aditya Bhure
  </text>
  
  <!-- Subtitle / Bio -->
  <text x="52" y="132" class="font-sub" font-size="19" fill="url(#accentGrad)" letter-spacing="0.5">
    AI/ML Engineer &amp; Backend Developer
  </text>
  
  <!-- Skills Tags -->
  <g transform="translate(50, 165)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="138" height="28" rx="8" fill="#14142b" stroke="#25254a" stroke-width="1" />
    <text x="12" y="18" class="font-badge" font-size="11" fill="#c7d2fe">⚡ Deep Learning</text>
    
    <!-- Tag 2 -->
    <rect x="150" y="0" width="148" height="28" rx="8" fill="#14142b" stroke="#25254a" stroke-width="1" />
    <text x="162" y="18" class="font-badge" font-size="11" fill="#c7d2fe">👁️ Computer Vision</text>

    <!-- Tag 3 -->
    <rect x="310" y="0" width="170" height="28" rx="8" fill="#14142b" stroke="#25254a" stroke-width="1" />
    <text x="322" y="18" class="font-badge" font-size="11" fill="#c7d2fe">🚀 Backend APIs (FastAPI)</text>
  </g>
  
  <!-- Terminal Window Mockup on the right -->
  <g transform="translate(550, 55)">
    <rect width="210" height="135" rx="10" fill="#040409" stroke="#1c1c35" stroke-width="1.5" />
    <!-- Header buttons -->
    <circle cx="16" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="28" cy="16" r="4.5" fill="#eab308" />
    <circle cx="40" cy="16" r="4.5" fill="#22c55e" />
    
    <!-- Code details -->
    <text x="16" y="46" class="font-mono" font-size="10.5" fill="#64748b">$ python3</text>
    <text x="16" y="68" class="font-mono" font-size="10.5" fill="#22c55e">&gt;&gt;&gt; import aditya</text>
    <text x="16" y="90" class="font-mono" font-size="10.5" fill="#38bdf8">&gt;&gt;&gt; aditya.status()</text>
    <text x="16" y="112" class="font-mono" font-size="10.5" fill="#ec4899">"dedicated_to_code"</text>
  </g>

  <!-- Bottom border line -->
  <path d="M 30,225 L 770,225" stroke="#16162d" stroke-width="1.5" stroke-linecap="round" />
</svg>
