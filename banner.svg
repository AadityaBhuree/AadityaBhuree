<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <!-- Dark professional background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <!-- Indigo accent gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Card background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Card border gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1000" height="300" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- Radial vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
    <stop offset="100%" stop-color="#0B0E14" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1000" height="300" fill="url(#vignette)"/>

  <!-- Top accent line with animation -->
  <rect x="0" y="0" width="1000" height="2" fill="url(#indigoGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== LEFT SIDE: Abstract data visualization ===== -->

  <!-- Data flow arcs -->
  <path d="M 40 220 Q 100 160 160 220" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.15"/>
  <path d="M 60 230 Q 120 170 180 230" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.12"/>
  <path d="M 30 210 Q 90 150 150 210" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.1"/>

  <!-- Minimal neural network nodes (subtle, elegant) -->
  <g opacity="0.5">
    <!-- Layer 1 -->
    <circle cx="50" cy="60" r="3" fill="#6366F1" filter="url(#glowSoft)"/>
    <circle cx="50" cy="100" r="3" fill="#6366F1" filter="url(#glowSoft)"/>
    <circle cx="50" cy="140" r="3" fill="#6366F1" filter="url(#glowSoft)"/>
    <circle cx="50" cy="180" r="3" fill="#6366F1" filter="url(#glowSoft)"/>

    <!-- Layer 2 -->
    <circle cx="120" cy="50" r="2.5" fill="#8B5CF6" filter="url(#glowSoft)"/>
    <circle cx="120" cy="90" r="2.5" fill="#8B5CF6" filter="url(#glowSoft)"/>
    <circle cx="120" cy="130" r="2.5" fill="#8B5CF6" filter="url(#glowSoft)"/>
    <circle cx="120" cy="170" r="2.5" fill="#8B5CF6" filter="url(#glowSoft)"/>
    <circle cx="120" cy="210" r="2.5" fill="#8B5CF6" filter="url(#glowSoft)"/>

    <!-- Layer 3 -->
    <circle cx="190" cy="70" r="3" fill="#6366F1" filter="url(#glowSoft)"/>
    <circle cx="190" cy="120" r="3" fill="#6366F1" filter="url(#glowSoft)"/>
    <circle cx="190" cy="170" r="3" fill="#6366F1" filter="url(#glowSoft)"/>

    <!-- Layer 4 (output, pulsing) -->
    <circle cx="250" cy="90" r="3.5" fill="#A78BFA" filter="url(#glowSoft)">
      <animate attributeName="r" values="3.5;4.5;3.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="150" r="3.5" fill="#A78BFA" filter="url(#glowSoft)">
      <animate attributeName="r" values="3.5;4.5;3.5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </circle>

    <!-- Connection lines (very faint) -->
    <g stroke-width="0.3" opacity="0.15">
      <line x1="53" y1="60" x2="117" y2="50" stroke="#6366F1"/>
      <line x1="53" y1="60" x2="117" y2="90" stroke="#6366F1"/>
      <line x1="53" y1="100" x2="117" y2="50" stroke="#8B5CF6"/>
      <line x1="53" y1="100" x2="117" y2="90" stroke="#8B5CF6"/>
      <line x1="53" y1="100" x2="117" y2="130" stroke="#8B5CF6"/>
      <line x1="53" y1="140" x2="117" y2="130" stroke="#6366F1"/>
      <line x1="53" y1="140" x2="117" y2="170" stroke="#6366F1"/>
      <line x1="53" y1="180" x2="117" y2="170" stroke="#8B5CF6"/>
      <line x1="53" y1="180" x2="117" y2="210" stroke="#8B5CF6"/>
      <line x1="122" y1="50" x2="187" y2="70" stroke="#8B5CF6"/>
      <line x1="122" y1="90" x2="187" y2="70" stroke="#8B5CF6"/>
      <line x1="122" y1="90" x2="187" y2="120" stroke="#8B5CF6"/>
      <line x1="122" y1="130" x2="187" y2="120" stroke="#8B5CF6"/>
      <line x1="122" y1="130" x2="187" y2="170" stroke="#8B5CF6"/>
      <line x1="122" y1="170" x2="187" y2="120" stroke="#8B5CF6"/>
      <line x1="122" y1="170" x2="187" y2="170" stroke="#8B5CF6"/>
      <line x1="122" y1="210" x2="187" y2="170" stroke="#8B5CF6"/>
      <line x1="193" y1="70" x2="247" y2="90" stroke="#6366F1"/>
      <line x1="193" y1="120" x2="247" y2="90" stroke="#6366F1"/>
      <line x1="193" y1="120" x2="247" y2="150" stroke="#6366F1"/>
      <line x1="193" y1="170" x2="247" y2="150" stroke="#6366F1"/>
    </g>
  </g>

  <!-- Floating data particles -->
  <circle r="1.5" fill="#6366F1" opacity="0.4">
    <animateMotion dur="12s" repeatCount="indefinite" path="M30,30 Q80,10 130,40 Q180,70 230,30"/>
  </circle>
  <circle r="1" fill="#8B5CF6" opacity="0.3">
    <animateMotion dur="15s" repeatCount="indefinite" path="M40,200 Q100,230 160,200 Q220,170 280,200"/>
  </circle>
  <circle r="1.5" fill="#A78BFA" opacity="0.35">
    <animateMotion dur="10s" repeatCount="indefinite" path="M20,120 Q70,90 130,110 Q190,130 240,100"/>
  </circle>

  <!-- ===== RIGHT SIDE: Professional Profile Card ===== -->

  <!-- Profile card background -->
  <rect x="320" y="30" width="640" height="240" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1"/>

  <!-- Inner glow at top of card -->
  <rect x="320" y="30" width="640" height="60" rx="12" fill="url(#indigoGrad)" opacity="0.03"/>

  <!-- Name -->
  <text x="640" y="85" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="36" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="-0.5">
    Aditya Bhure
  </text>

  <!-- Divider line under name -->
  <line x1="400" y1="100" x2="880" y2="100" stroke="#334155" stroke-width="1"/>
  <line x1="540" y1="100" x2="700" y2="100" stroke="#6366F1" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Title badges -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="100" height="24" rx="6" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="0.5" stroke-opacity="0.4">
      <animate attributeName="fill-opacity" values="0.12;0.18;0.12" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="50" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#818CF8" text-anchor="middle" font-weight="500">AI / ML Engineer</text>

    <rect x="110" y="0" width="120" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.4">
      <animate attributeName="fill-opacity" values="0.12;0.18;0.12" dur="6s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text x="170" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#A78BFA" text-anchor="middle" font-weight="500">Backend Developer</text>

    <rect x="240" y="0" width="100" height="24" rx="6" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="0.5" stroke-opacity="0.4">
      <animate attributeName="fill-opacity" values="0.12;0.18;0.12" dur="6s" repeatCount="indefinite" begin="2s"/>
    </rect>
    <text x="290" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#C4B5FD" text-anchor="middle" font-weight="500">Deep Learning</text>
  </g>

  <!-- Info row: Education + Status side by side -->
  <g transform="translate(420, 165)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" font-weight="500">EDUCATION</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-size="13" fill="#CBD5E1">B.Tech AI &amp; Data Science</text>

    <g transform="translate(220, 0)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" font-weight="500">STATUS</text>
      <text x="0" y="18" font-family="'Inter', sans-serif" font-size="13" fill="#CBD5E1">Seeking Internships 2026</text>
    </g>
  </g>

  <!-- Expertise tag chips -->
  <g transform="translate(420, 210)">
    <rect x="0" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="32" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Python</text>

    <rect x="70" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="102" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">PyTorch</text>

    <rect x="140" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="172" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Computer Vision</text>

    <rect x="210" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="242" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">LLMs + RAG</text>

    <rect x="280" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="312" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">FastAPI</text>

    <rect x="350" y="0" width="64" height="20" rx="4" fill="#334155" fill-opacity="0.6"/>
    <text x="382" y="14" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Docker</text>
  </g>

  <!-- ===== BOTTOM: Professional status bar ===== -->

  <rect x="0" y="270" width="1000" height="30" fill="#0F172A" opacity="0.95"/>
  <rect x="0" y="270" width="1000" height="1" fill="#1E293B"/>

  <!-- Bottom bar left: git handle + email -->
  <text x="20" y="289" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#475569">❯</text>
  <text x="32" y="289" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#64748B">github.com/AadityaBhuree</text>
  <text x="210" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#475569">·</text>
  <text x="220" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">aadityabhure03@gmail.com</text>

  <!-- Bottom bar right: status indicator -->
  <circle cx="742" cy="286" r="3" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="750" y="289" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Open for opportunities</text>

  <!-- Pulsing cursor at far right -->
  <rect x="975" y="276" width="6" height="16" rx="1" fill="#6366F1" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
