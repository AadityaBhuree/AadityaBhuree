name: 📊 Refresh Profile

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday
  workflow_dispatch:      # Manual trigger

jobs:
  refresh:
    name: Update Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ℹ️ Generate last-updated badge
        run: |
          echo "Last refreshed: $(date -u '+%Y-%m-%d %H:%M UTC')" > .last-updated

      - name: ⏫ Commit & Push
        run: |
          git config user.name "Aditya Bhure"
          git config user.email "aadityabhure03@gmail.com"
          git add .last-updated
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh profile [automated]"
          git push
