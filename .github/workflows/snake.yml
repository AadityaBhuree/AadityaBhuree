name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AadityaBhuree
          outputs: |
              dist/github-snake.svg?color_snake=%236366F1&color_dots=%23FFFFFF,%23F8FAFC,%23E2E8F0,%23CBD5E1,%236366F1
              dist/github-snake-light.svg?palette=github-light&color_snake=%236366F1&color_dots=%23FFFFFF,%23F8FAFC,%23E2E8F0,%23CBD5E1,%236366F1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
