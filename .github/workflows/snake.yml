name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AadityaBhuree
          outputs: |
            dist/github-snake.svg?color_snake=%2300FFFF&color_dots=%230D1117,%231E1B4B,%2331105E,%238B5CF6,%2300FFFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300FFFF&color_dots=%230D1117,%231E1B4B,%2331105E,%238B5CF6,%2300FFFF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
