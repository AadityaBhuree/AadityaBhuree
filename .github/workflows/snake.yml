name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AadityaBhuree
          outputs: |
            dist/github-snake.svg?color_snake=%2300ffff&color_dots=%2305050a,%231e1b4b,%2331105e,%238b5cf6,%2300ffff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300ffff&color_dots=%2305050a,%231e1b4b,%2331105e,%238b5cf6,%2300ffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
