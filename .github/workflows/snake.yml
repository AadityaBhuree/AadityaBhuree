name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AadityaBhuree
          outputs: |
            dist/github-snake.svg?color_snake=%230ea5e9&color_dots=%23ebedf0,%23cbd5e1,%2394a3b8,%23475569,%231e293b
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338bdf8&color_dots=%23161b22,%231e293b,%23334155,%23475569,%2394a3b8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
